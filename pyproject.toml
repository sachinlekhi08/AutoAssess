[project]
name = "autoassess"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<6",
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "imbalanced-learn==0.13.0",
    "joblib==1.5.3",
    "pandas==2.2.2",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "scikit-learn==1.6.1",
    "uvicorn[standard]>=0.52.4",
    "whitenoise>=6.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "car_evaluation.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]
